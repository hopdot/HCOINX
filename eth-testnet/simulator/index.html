<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HCOINX Mesh Node Simulator</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    body { font-family: monospace; background: #0d1117; color: #c9d1d9; padding: 20px; }
    h2  { color: #58a6ff; }
    #log { background: #161b22; border: 1px solid #30363d; padding: 12px; height: 380px;
           overflow-y: auto; font-size: 13px; border-radius: 6px; }
    .ok   { color: #3fb950; }
    .err  { color: #f85149; }
    .info { color: #d29922; }
    .peer { color: #79c0ff; }
    button { background: #238636; color: #fff; border: none; padding: 8px 18px;
             border-radius: 6px; cursor: pointer; margin: 4px; font-size: 14px; }
    button:hover { background: #2ea043; }
    button.red { background: #da3633; }
    button.red:hover { background: #b62324; }
    input { background: #161b22; color: #c9d1d9; border: 1px solid #30363d;
            padding: 6px 10px; border-radius: 6px; }
    label { color: #8b949e; font-size: 13px; }
    .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px;
             padding: 16px; margin-bottom: 14px; }
    .row { margin-bottom: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    #status { font-size: 13px; padding: 6px 12px; border-radius: 6px;
              background: #21262d; display: inline-block; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>⚡ HCOINX Mesh Node Simulator</h2>

  <div class="panel">
    <div class="row">
      <label>Node ID:</label>
      <input id="nodeID" value="NODE1" style="width:90px"/>
      <label>RPC:</label>
      <input id="rpcUrl" value="http://127.0.0.1:8545" style="width:210px"/>
      <label>Relay WS:</label>
      <input id="wsUrl" value="ws://localhost:8080" style="width:180px"/>
    </div>
    <div class="row">
      <label>Contract:</label>
      <input id="contractAddr" placeholder="0x... paste after deploy" style="width:360px"/>
    </div>
    <div class="row">
      <button onclick="initNode()">🔌 Connect Node</button>
      <button onclick="startAuto()">▶️ Auto-Broadcast (10s)</button>
      <button onclick="stopAuto()" class="red">⏹ Stop</button>
      <button onclick="clearLog()">🗑 Clear</button>
    </div>
    <div id="status">⚪ Not connected</div>
  </div>

  <div id="log"></div>

  <script>
    const ABI = [
      {
        inputs: [
          {internalType:"uint32",  name:"packetID", type:"uint32"},
          {internalType:"string",  name:"deviceID", type:"string"},
          {internalType:"string",  name:"payload",  type:"string"}
        ],
        name: "submitPacket", outputs: [], stateMutability: "nonpayable", type: "function"
      },
      {
        anonymous: false,
        inputs: [
          {indexed:false,internalType:"uint32",name:"packetID",type:"uint32"},
          {indexed:false,internalType:"string",name:"deviceID",type:"string"},
          {indexed:false,internalType:"string",name:"payload",type:"string"}
        ],
        name: "NewData", type: "event"
      }
    ];

    let provider, signer, oracle, ws;
    let seenPackets  = new Set();
    let autoTimer    = null;
    let packetCounter = 1;

    // ── Logging ──────────────────────────────────────────────────
    function log(msg, type = "info") {
      const el  = document.getElementById("log");
      const ts  = new Date().toLocaleTimeString();
      el.innerHTML += `<div class="${type}">[${ts}] ${msg}</div>`;
      el.scrollTop  = el.scrollHeight;
    }
    function clearLog() { document.getElementById("log").innerHTML = ""; }
    function setStatus(text, color = "#8b949e") {
      const el = document.getElementById("status");
      el.textContent = text;
      el.style.color = color;
    }

    // ── Connect Ethereum + WebSocket relay ───────────────────────
    async function initNode() {
      const rpc  = document.getElementById("rpcUrl").value;
      const addr = document.getElementById("contractAddr").value.trim();
      const wsURL = document.getElementById("wsUrl").value.trim();
      const nodeID = document.getElementById("nodeID").value.trim();

      if (!addr) { log("Paste a contract address first.", "err"); return; }

      // Ethereum
      try {
        provider = new ethers.providers.JsonRpcProvider(rpc);
        signer   = provider.getSigner(0);
        oracle   = new ethers.Contract(addr, ABI, signer);
        log(`Ethereum connected → ${rpc}`, "ok");
        oracle.on("NewData", (packetID, deviceID, payload) => {
          log(`📡 On-chain event: #${packetID} from ${deviceID} | ${payload}`, "info");
        });
      } catch(e) { log(`Ethereum failed: ${e.message}`, "err"); return; }

      // WebSocket relay
      connectRelay(wsURL, nodeID);
    }

    function connectRelay(wsURL, nodeID) {
      if (ws) ws.close();
      try {
        ws = new WebSocket(wsURL);
        ws.onopen = () => {
          ws.send(JSON.stringify({ type: "register", nodeID }));
          log(`WebSocket relay connected → ${wsURL}`, "ok");
          setStatus(`🟢 ${nodeID} connected`, "#3fb950");
        };
        ws.onmessage = (evt) => {
          const msg = JSON.parse(evt.data);
          if (msg.type === "info") { log(`ℹ️  ${msg.text}`, "peer"); return; }
          if (msg.type === "packet") {
            log(`📶 Mesh packet from ${msg.packet.senderID}: "${msg.packet.payload}" (TTL=${msg.packet.TTL})`, "peer");
            processMeshPacket(msg.packet, false); // received — don't relay back
          }
        };
        ws.onclose = () => { log("WebSocket relay disconnected.", "err"); setStatus("🔴 Disconnected", "#f85149"); };
        ws.onerror = () => { log("WebSocket error.", "err"); };
      } catch(e) { log(`WS failed: ${e.message}`, "err"); }
    }

    // ── Mesh packet processing ───────────────────────────────────
    async function processMeshPacket(packet, relay = true) {
      if (seenPackets.has(packet.packetID)) {
        log(`⚠️ Duplicate #${packet.packetID} ignored`, "info");
        return;
      }
      seenPackets.add(packet.packetID);

      if (relay && ws && ws.readyState === WebSocket.OPEN) {
        if (packet.TTL > 1) {
          packet.TTL--;
          log(`🔁 Relaying to peers (TTL=${packet.TTL})`, "info");
          ws.send(JSON.stringify({ type: "packet", packet }));
        }
      }

      await submitToEthereum(packet);
    }

    // ── Ethereum submit ──────────────────────────────────────────
    async function submitToEthereum(packet) {
      if (!oracle) { log("Oracle not connected.", "err"); return; }
      try {
        log(`⛓  Submitting #${packet.packetID} to chain...`, "info");
        const tx = await oracle.submitPacket(packet.packetID, packet.senderID, packet.payload);
        await tx.wait();
        log(`✅ #${packet.packetID} confirmed | TX: ${tx.hash.slice(0,20)}...`, "ok");
      } catch(e) {
        log(`❌ Submit failed #${packet.packetID}: ${e.message}`, "err");
      }
    }

    // ── Sensor data generator ────────────────────────────────────
    function generateReading() {
      const nodeID = document.getElementById("nodeID").value.trim();
      const dist   = (Math.random() * 400 + 10).toFixed(1);
      const temp   = (Math.random() * 15  + 20).toFixed(1);
      return {
        packetID: packetCounter++,
        senderID: nodeID,
        payload:  `dist:${dist}cm,temp:${temp}C`,
        TTL: 3
      };
    }

    async function broadcastOnce() {
      if (!oracle) { log("Connect node first.", "err"); return; }
      const packet = generateReading();
      log(`📡 Broadcasting: ${packet.payload}`, "info");
      await processMeshPacket(packet, true);
    }

    function startAuto() {
      if (!oracle) { log("Connect node first.", "err"); return; }
      if (autoTimer) return;
      log("▶️ Auto-broadcast started (10s interval)", "ok");
      broadcastOnce();
      autoTimer = setInterval(broadcastOnce, 10000);
    }

    function stopAuto() {
      if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
      log("⏹ Auto-broadcast stopped.", "info");
    }
  </script>
</body>
</html>
