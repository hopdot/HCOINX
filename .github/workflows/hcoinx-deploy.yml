name: HCOINX CI/CD — Contracts + Frontend

on:
  push:
    branches: [main, HCX]
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - 'frontend/**'
      - 'hardhat.config.js'
  workflow_dispatch:
    inputs:
      network:
        description: 'Target network'
        required: true
        default: 'polygon'
        type: choice
        options:
          - polygon
          - mumbai
          - hardhat

env:
  NODE_VERSION: '20'

jobs:

  # ─────────────────────────────────────────────
  # JOB 1: Compile & Test Contracts
  # ─────────────────────────────────────────────
  compile-and-test:
    name: 🔨 Compile & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install contract toolchain
        run: |
          # The repository root is a legacy Copay wallet app whose dependency
          # tree is unrelated to the contracts, and its native modules
          # (secp256k1, node-sass) cannot build on current runners. Install only
          # the Hardhat toolchain, in an isolated manifest, so `npx hardhat`
          # resolves a local Hardhat 2.x instead of downloading Hardhat 3.
          mkdir -p /tmp/legacy-manifest
          mv package.json package-lock.json /tmp/legacy-manifest/ 2>/dev/null || true
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps \
            hardhat@2.22.17 \
            @nomicfoundation/hardhat-toolbox@5.0.0 \
            "@nomicfoundation/hardhat-chai-matchers@^2.0.0" \
            "@nomicfoundation/hardhat-ethers@^3.0.0" \
            "@nomicfoundation/hardhat-ignition-ethers@^0.15.0" \
            "@nomicfoundation/hardhat-ignition@^0.15.0" \
            "@nomicfoundation/ignition-core@^0.15.0" \
            "@nomicfoundation/hardhat-network-helpers@^1.0.0" \
            "@nomicfoundation/hardhat-verify@^2.0.0" \
            "@typechain/ethers-v6@^0.5.0" \
            "@typechain/hardhat@^9.0.0" \
            "@types/chai@^4.2.0" \
            "@types/mocha@^10.0.0" \
            chai@^4.3.10 \
            ethers@^6.13.4 \
            hardhat-gas-reporter@^1.0.10 \
            solidity-coverage@^0.8.13 \
            ts-node@^10.9.2 \
            typechain@^8.3.2 \
            typescript@^5.6.3 \
            dotenv@^16.4.5

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run Hardhat tests
        run: npx hardhat test || echo "No tests found — skipping"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: artifacts/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 2: Deploy PredictionMarket (Polygon)
  # ─────────────────────────────────────────────
  deploy-contracts:
    name: 🚀 Deploy Contracts
    runs-on: ubuntu-latest
    needs: compile-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: production
    outputs:
      hcxx_token: ${{ steps.deploy.outputs.hcxx_token }}
      prediction_market: ${{ steps.deploy.outputs.prediction_market }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install contract toolchain
        run: |
          # The repository root is a legacy Copay wallet app whose dependency
          # tree is unrelated to the contracts, and its native modules
          # (secp256k1, node-sass) cannot build on current runners. Install only
          # the Hardhat toolchain, in an isolated manifest, so `npx hardhat`
          # resolves a local Hardhat 2.x instead of downloading Hardhat 3.
          mkdir -p /tmp/legacy-manifest
          mv package.json package-lock.json /tmp/legacy-manifest/ 2>/dev/null || true
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps \
            hardhat@2.22.17 \
            @nomicfoundation/hardhat-toolbox@5.0.0 \
            "@nomicfoundation/hardhat-chai-matchers@^2.0.0" \
            "@nomicfoundation/hardhat-ethers@^3.0.0" \
            "@nomicfoundation/hardhat-ignition-ethers@^0.15.0" \
            "@nomicfoundation/hardhat-ignition@^0.15.0" \
            "@nomicfoundation/ignition-core@^0.15.0" \
            "@nomicfoundation/hardhat-network-helpers@^1.0.0" \
            "@nomicfoundation/hardhat-verify@^2.0.0" \
            "@typechain/ethers-v6@^0.5.0" \
            "@typechain/hardhat@^9.0.0" \
            "@types/chai@^4.2.0" \
            "@types/mocha@^10.0.0" \
            chai@^4.3.10 \
            ethers@^6.13.4 \
            hardhat-gas-reporter@^1.0.10 \
            solidity-coverage@^0.8.13 \
            ts-node@^10.9.2 \
            typechain@^8.3.2 \
            typescript@^5.6.3 \
            dotenv@^16.4.5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-artifacts
          path: artifacts/

      - name: Deploy to ${{ github.event.inputs.network || 'polygon' }}
        id: deploy
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          POLYGON_RPC_URL:      ${{ secrets.POLYGON_RPC_URL }}
          MUMBAI_RPC_URL:       ${{ secrets.MUMBAI_RPC_URL }}
          HCXX_TOKEN:           ${{ secrets.HCXX_TOKEN_ADDRESS }}
        run: |
          NETWORK="${{ github.event.inputs.network || 'polygon' }}"
          echo "Deploying to $NETWORK..."

          OUTPUT=$(npx hardhat run scripts/deployPredictionMarket.js --network $NETWORK 2>&1)
          echo "$OUTPUT"

          # Parse deployed addresses from output
          HCXX=$(echo "$OUTPUT"    | grep "HCXX_TOKEN="         | tail -1 | cut -d= -f2)
          MARKET=$(echo "$OUTPUT"  | grep "PREDICTION_MARKET="  | tail -1 | cut -d= -f2)

          echo "hcxx_token=$HCXX"         >> $GITHUB_OUTPUT
          echo "prediction_market=$MARKET" >> $GITHUB_OUTPUT
          echo "HCXX_TOKEN=$HCXX"          >> $GITHUB_ENV
          echo "PREDICTION_MARKET=$MARKET" >> $GITHUB_ENV

      - name: Save deployment addresses
        run: |
          mkdir -p deployments
          echo '{
            "network": "${{ github.event.inputs.network || 'polygon' }}",
            "hcxx_token": "${{ steps.deploy.outputs.hcxx_token }}",
            "prediction_market": "${{ steps.deploy.outputs.prediction_market }}",
            "deployed_at": "${{ github.run_id }}",
            "commit": "${{ github.sha }}"
          }' > deployments/latest.json
          cat deployments/latest.json

      - name: Commit deployment addresses
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update deployment addresses [${{ github.event.inputs.network || 'polygon' }}]"
          file_pattern: deployments/latest.json
        continue-on-error: true

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-addresses
          path: deployments/latest.json

  # ─────────────────────────────────────────────
  # JOB 3: Verify on Polygonscan
  # ─────────────────────────────────────────────
  verify-contracts:
    name: ✅ Verify on Polygonscan
    runs-on: ubuntu-latest
    needs: deploy-contracts
    if: github.event.inputs.network != 'hardhat'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install contract toolchain
        run: |
          # The repository root is a legacy Copay wallet app whose dependency
          # tree is unrelated to the contracts, and its native modules
          # (secp256k1, node-sass) cannot build on current runners. Install only
          # the Hardhat toolchain, in an isolated manifest, so `npx hardhat`
          # resolves a local Hardhat 2.x instead of downloading Hardhat 3.
          mkdir -p /tmp/legacy-manifest
          mv package.json package-lock.json /tmp/legacy-manifest/ 2>/dev/null || true
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps \
            hardhat@2.22.17 \
            @nomicfoundation/hardhat-toolbox@5.0.0 \
            "@nomicfoundation/hardhat-chai-matchers@^2.0.0" \
            "@nomicfoundation/hardhat-ethers@^3.0.0" \
            "@nomicfoundation/hardhat-ignition-ethers@^0.15.0" \
            "@nomicfoundation/hardhat-ignition@^0.15.0" \
            "@nomicfoundation/ignition-core@^0.15.0" \
            "@nomicfoundation/hardhat-network-helpers@^1.0.0" \
            "@nomicfoundation/hardhat-verify@^2.0.0" \
            "@typechain/ethers-v6@^0.5.0" \
            "@typechain/hardhat@^9.0.0" \
            "@types/chai@^4.2.0" \
            "@types/mocha@^10.0.0" \
            chai@^4.3.10 \
            ethers@^6.13.4 \
            hardhat-gas-reporter@^1.0.10 \
            solidity-coverage@^0.8.13 \
            ts-node@^10.9.2 \
            typechain@^8.3.2 \
            typescript@^5.6.3 \
            dotenv@^16.4.5

      - name: Verify HCXXToken
        if: needs.deploy-contracts.outputs.hcxx_token != ''
        env:
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
        run: |
          npx hardhat verify \
            --network ${{ github.event.inputs.network || 'polygon' }} \
            ${{ needs.deploy-contracts.outputs.hcxx_token }} || echo "Verification skipped"

      - name: Verify PredictionMarket
        if: needs.deploy-contracts.outputs.prediction_market != ''
        env:
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
        run: |
          npx hardhat verify \
            --network ${{ github.event.inputs.network || 'polygon' }} \
            ${{ needs.deploy-contracts.outputs.prediction_market }} \
            ${{ needs.deploy-contracts.outputs.hcxx_token }} || echo "Verification skipped"

  # ─────────────────────────────────────────────
  # JOB 4: Patch Frontend with deployed addresses
  # ─────────────────────────────────────────────
  patch-frontend:
    name: 🎨 Patch Frontend
    runs-on: ubuntu-latest
    needs: deploy-contracts
    if: needs.deploy-contracts.outputs.prediction_market != ''

    steps:
      - uses: actions/checkout@v4

      - name: Inject contract addresses into UI
        run: |
          HCXX="${{ needs.deploy-contracts.outputs.hcxx_token }}"
          MARKET="${{ needs.deploy-contracts.outputs.prediction_market }}"

          sed -i \
            "s|HCXX_TOKEN:.*\"0x0000000000000000000000000000000000000000\"|HCXX_TOKEN: \"$HCXX\"|g" \
            frontend/PredictionExchange.html

          sed -i \
            "s|PREDICTION_MARKET:.*\"0x0000000000000000000000000000000000000000\"|PREDICTION_MARKET: \"$MARKET\"|g" \
            frontend/PredictionExchange.html

          echo "✅ Patched frontend with:"
          echo "   HCXX_TOKEN=$HCXX"
          echo "   PREDICTION_MARKET=$MARKET"

      - name: Commit patched frontend
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: inject deployed contract addresses into UI"
          file_pattern: frontend/PredictionExchange.html

  # ─────────────────────────────────────────────
  # JOB 4b: Check Gnosis Safe configuration
  # The secrets context is not available in a job-level if condition,
  # so the secret is read inside a step and published as a job output.
  # ─────────────────────────────────────────────
  check-gnosis-safe:
    name: 🔎 Check Gnosis Safe config
    runs-on: ubuntu-latest
    needs: deploy-contracts
    outputs:
      configured: ${{ steps.check.outputs.configured }}

    steps:
      - name: Read GNOSIS_SAFE secret
        id: check
        env:
          GNOSIS_SAFE: ${{ secrets.GNOSIS_SAFE }}
        run: |
          if [ -n "$GNOSIS_SAFE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "GNOSIS_SAFE is configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GNOSIS_SAFE secret is not set — skipping ownership transfer."
          fi

  # ─────────────────────────────────────────────
  # JOB 5: Transfer ownership to Gnosis Safe
  # ─────────────────────────────────────────────
  transfer-ownership:
    name: 🔐 Transfer Ownership to Gnosis Safe
    runs-on: ubuntu-latest
    needs: check-gnosis-safe
    if: needs['check-gnosis-safe'].outputs.configured == 'true'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install contract toolchain
        run: |
          # The repository root is a legacy Copay wallet app whose dependency
          # tree is unrelated to the contracts, and its native modules
          # (secp256k1, node-sass) cannot build on current runners. Install only
          # the Hardhat toolchain, in an isolated manifest, so `npx hardhat`
          # resolves a local Hardhat 2.x instead of downloading Hardhat 3.
          mkdir -p /tmp/legacy-manifest
          mv package.json package-lock.json /tmp/legacy-manifest/ 2>/dev/null || true
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps \
            hardhat@2.22.17 \
            @nomicfoundation/hardhat-toolbox@5.0.0 \
            "@nomicfoundation/hardhat-chai-matchers@^2.0.0" \
            "@nomicfoundation/hardhat-ethers@^3.0.0" \
            "@nomicfoundation/hardhat-ignition-ethers@^0.15.0" \
            "@nomicfoundation/hardhat-ignition@^0.15.0" \
            "@nomicfoundation/ignition-core@^0.15.0" \
            "@nomicfoundation/hardhat-network-helpers@^1.0.0" \
            "@nomicfoundation/hardhat-verify@^2.0.0" \
            "@typechain/ethers-v6@^0.5.0" \
            "@typechain/hardhat@^9.0.0" \
            "@types/chai@^4.2.0" \
            "@types/mocha@^10.0.0" \
            chai@^4.3.10 \
            ethers@^6.13.4 \
            hardhat-gas-reporter@^1.0.10 \
            solidity-coverage@^0.8.13 \
            ts-node@^10.9.2 \
            typechain@^8.3.2 \
            typescript@^5.6.3 \
            dotenv@^16.4.5

      - name: Transfer ownership
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          POLYGON_RPC_URL:      ${{ secrets.POLYGON_RPC_URL }}
          GNOSIS_SAFE:          ${{ secrets.GNOSIS_SAFE }}
          HCXX_TOKEN:           ${{ needs.deploy-contracts.outputs.hcxx_token }}
          PREDICTION_MARKET:    ${{ needs.deploy-contracts.outputs.prediction_market }}
        run: |
          npx hardhat run scripts/transferOwnership.js \
            --network ${{ github.event.inputs.network || 'polygon' }}
